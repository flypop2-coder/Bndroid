[package]
name = "bndroid-kernel"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "bndroid-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bndr-appdata = { path = "../crates/bndr-appdata", optional = true }
bndr-abi = { path = "../crates/bndr-abi" }
bndr-androidbox = { path = "../crates/bndr-androidbox", optional = true }
bndr-elf = { path = "../crates/bndr-elf" }
bndr-input = { path = "../crates/bndr-input" }
bndr-package-store = { path = "../crates/bndr-package-store", optional = true }
bndr-sm = { path = "../crates/bndr-sm" }
bndr-ui = { path = "../crates/bndr-ui" }

[features]
default = []
cooperative-block-recovery = []
app-lifecycle-runtime = []
app-crash-recovery-runtime = ["app-lifecycle-runtime"]
mapped-graphics-runtime = ["app-lifecycle-runtime"]
graphics-owner-death-runtime = ["mapped-graphics-runtime"]
graphics-surface-restart-runtime = ["graphics-owner-death-runtime"]
graphics-producer-orphan-runtime = ["graphics-owner-death-runtime"]
surface-frame-pacing = []
graphics-frame-clock-runtime = ["mapped-graphics-runtime", "surface-frame-pacing"]
graphics-swapchain-runtime = ["graphics-frame-clock-runtime"]
multi-window-runtime = ["graphics-frame-clock-runtime", "surface-trace-evidence"]
mobile-ui-runtime = [
    "surface-frame-pacing",
    "surface-trace-evidence",
    "bndr-abi/mobile-ui-runtime",
    "bndr-input/mobile-ui-runtime",
    "bndr-ui/mobile-ui-runtime",
]
androidbox-dex0 = ["mobile-ui-runtime"]
androidbox-apk-install0 = [
    "androidbox-dex0",
    "bndr-abi/androidbox-apk-install0",
    "dep:bndr-androidbox",
    "dep:bndr-package-store",
]
androidbox-el0-runtime0 = [
    "androidbox-apk-install0",
    "bndr-abi/androidbox-el0-runtime0",
    "bndr-ui/androidbox-el0-runtime0",
]
androidbox-interactive0 = [
    "androidbox-el0-runtime0",
    "bndr-abi/androidbox-interactive0",
    "bndr-ui/androidbox-interactive0",
]
androidbox-process0 = [
    "androidbox-interactive0",
    "bndr-abi/androidbox-process0",
    "bndr-ui/androidbox-process0",
]
androidbox-restart0 = [
    "androidbox-process0",
    "bndr-abi/androidbox-restart0",
    "bndr-ui/androidbox-restart0",
]
androidbox-scene-rpc2 = [
